<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel administrativo</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script></head><body><main class="wrap"><section id="login" class="card public"><div class="accent"></div><div class="brand"><img src="logo.png" class="logo" alt="Posto Premium"></div><h1>Acesso administrativo</h1><p class="muted">Área exclusiva da equipe.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="senha" type="password" required><button type="submit">Entrar</button></form><p id="loginMsg" class="msg"></p></section><section id="panel" class="hidden"><div class="top"><div class="topBrand"><img src="logo.png" class="miniLogo" alt="Posto Premium"><div><h1>Cadastros recebidos</h1><p id="user" class="muted"></p></div></div><button id="logout" class="secondary">Sair</button></div><section class="card"><div class="toolbar"><input id="search" type="search" placeholder="Buscar nome, CPF ou telefone"><button id="pdf">Exportar PDF</button></div><div class="table"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Data</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted hidden">Nenhum cadastro recebido.</p></section></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
