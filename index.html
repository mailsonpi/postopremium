<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de Cliente</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><section class="card public"><div class="accent"></div><div class="brand"><img src="logo.png" class="logo" alt="Posto Premium"></div><h1>Cadastro de Clientes</h1><p class="muted">Preencha seus dados e faça parte da nossa base de clientes.</p><form id="form"><label>Nome completo</label><input id="nome" required maxlength="150"><label>CPF</label><input id="cpf" required maxlength="14" inputmode="numeric" placeholder="000.000.000-00"><label>Telefone</label><input id="telefone" required maxlength="15" inputmode="tel" placeholder="(00) 00000-0000"><button id="send" type="submit">Enviar informações</button></form><p id="msg" class="msg"></p></section></main><script src="config.js"></script><script src="public.js"></script></body></html>
